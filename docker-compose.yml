version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2023-01-02T09-40-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: benchmarkadmin
      MINIO_ROOT_PASSWORD: benchmarkpass2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  minio_data: